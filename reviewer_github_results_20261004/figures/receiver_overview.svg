<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="478" viewBox="0 0 1280 478" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Tanner Graph receiver overview</title>
  <desc id="desc">Initial LDPC belief propagation produces tentative bytes. ByT5 produces byte distributions. Joint semantic factors exchange messages with LDPC belief propagation. Inner iterations update messages; later invocations refresh probabilities on unresolved blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101d38"/><stop offset="1" stop-color="#173e59"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#69ced5"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b6c9de"/></marker>
  </defs>
  <rect width="1280" height="478" rx="18" fill="url(#bg)"/>
  <circle cx="1150" cy="60" r="190" fill="#42b9c2" opacity=".04"/>
  <circle cx="1150" cy="60" r="130" fill="none" stroke="#64c8d1" opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="56" fill="#67d5d3" font-size="14" letter-spacing="3">RESEARCH RESULTS · SEMANTIC-ASSISTED COMMUNICATIONS</text>
    <text x="52" y="112" fill="#ffffff" font-size="44" font-weight="700">Semantic Tanner Graph</text>
    <text x="55" y="153" fill="#c8d9e9" font-size="23">Byte-level probabilities. Joint bit constraints. Iterative decoding.</text>
    <g font-size="14" fill="#d8e8f5">
      <rect x="54" y="178" width="141" height="30" rx="15" fill="#25435d"/><text x="76" y="198">130-byte payload</text>
      <rect x="205" y="178" width="190" height="30" rx="15" fill="#25435d"/><text x="226" y="198">WiMAX (1248, 1040)</text>
      <rect x="405" y="178" width="156" height="30" rx="15" fill="#25435d"/><text x="426" y="198">BPSK over AWGN</text>
    </g>
    <g stroke="#44677f" stroke-width="1.2" fill="#172e47">
      <rect x="54" y="268" width="243" height="82" rx="10"/>
      <rect x="357" y="268" width="243" height="82" rx="10"/>
      <rect x="660" y="268" width="243" height="82" rx="10"/>
      <rect x="963" y="268" width="263" height="82" rx="10"/>
    </g>
    <g fill="#ffffff" font-size="21" font-weight="700">
      <text x="77" y="302">Initial LDPC BP</text><text x="380" y="302">ByT5 encoder</text>
      <text x="683" y="302">Semantic factors</text><text x="986" y="302">LDPC BP updates</text>
    </g>
    <g fill="#b6c9de" font-size="15">
      <text x="77" y="328">Tentative payload bytes</text><text x="380" y="328">256 probabilities per byte</text>
      <text x="683" y="328">Joint eight-bit configurations</text><text x="986" y="328">Updated bit beliefs</text>
    </g>
    <g fill="none" stroke="#69ced5" stroke-width="2" marker-end="url(#arrow)">
      <path d="M299 309 H349"/><path d="M602 309 H652"/><path d="M905 309 H955"/>
      <path d="M1095 268 V247 H782 V265"/>
    </g>
    <text x="845" y="236" fill="#85ddd9" font-size="14">Inner iterations: update messages</text>
    <path d="M1095 353 V397 H479 V354" fill="none" stroke="#b6c9de" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow2)"/>
    <text x="564" y="426" fill="#c8d9e9" font-size="14">Later invocations: refresh byte probabilities for unresolved blocks</text>
    <text x="55" y="453" fill="#8ba8c0" font-size="12">Conceptual flow; syndrome-based early stopping is applied throughout decoding.</text>
  </g>
</svg>
